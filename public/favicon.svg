<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    </style>
    <clipPath id="circle">
      <circle cx="90" cy="90" r="85"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <circle cx="90" cy="90" r="90" fill="#071426"/>
  <!-- Circular gradient border -->
  <circle cx="90" cy="90" r="85" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.8"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6ec7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a7bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2de7d8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Initials as fallback (DW) -->
  <text x="90" y="100" font-family="Poppins, sans-serif" font-size="48" font-weight="700" fill="#cfeefc" text-anchor="middle">DW</text>
</svg>
